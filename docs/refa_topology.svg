<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 640" width="990" height="640" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">TMSi reference amplifier: common average EEG input stage</title>
<desc id="d">Each electrode drives the + input of a 50x preamplifier. The preamplifier outputs are summed and buffered to form the common average E_av, which is fed back to the - input of every preamplifier and to the - input of a 1x differential stage per channel, giving E_i - E_av. Each channel then passes a 10 s time constant, a 100x amplifier with low-pass, a pulse width modulator, an optical isolation barrier, a demodulator, a 200 Hz low-pass filter and an output amplifier. After Clots, Mulder and Hoekstra.</desc>
